<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cognix · Multi-escolas e gestão docente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral com perfil de acesso + área de trabalho em grade; cor de lousa como acento */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18221e; --muted:#5d6b65; --line:#dce3e0;
  --accent:#1f6b52; --accent-soft:#e2f0ea; --accent-ink:#ffffff;
  --good:#1d7a46; --warn:#a86a00; --bad:#b3372e; --good-bg:#e3f4ea; --warn-bg:#fbf0d9; --bad-bg:#fbe5e2;
  --chart2:#c58a1c;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111715; --surface:#19211e; --ink:#e4ece8; --muted:#94a39c; --line:#2b3632;
    --accent:#5cc79e; --accent-soft:#1f332b; --accent-ink:#0d1512;
    --good:#5fd08e; --warn:#e8b04a; --bad:#f07a6e; --good-bg:#1a3326; --warn-bg:#3a2e14; --bad-bg:#3d1f1c;
    --chart2:#e8b04a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19211e; --ink:#e4ece8; --muted:#94a39c; --line:#2b3632;
  --accent:#5cc79e; --accent-soft:#1f332b; --accent-ink:#0d1512;
  --good:#5fd08e; --warn:#e8b04a; --bad:#f07a6e; --good-bg:#1a3326; --warn-bg:#3a2e14; --bad-bg:#3d1f1c;
  --chart2:#e8b04a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-size:20px;font-weight:700;padding:0 10px 4px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
.school{font-size:12px;color:var(--muted);padding:0 10px 12px}
.who{margin:0 4px 12px;padding:10px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.who select{width:100%}
.who .papel{font-size:12px;color:var(--muted)}
#navlinks{display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--bg)}
nav.side a.on{background:var(--accent-soft);color:var(--accent)}
nav.side a small{font-family:var(--mono);font-size:11px;color:var(--muted)}
nav.side a small.alert{color:var(--bad);font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;display:flex;flex-direction:column;gap:6px}
.lock{display:flex;gap:6px;align-items:flex-start}
.lock svg{flex:none;margin-top:2px}
main{padding:24px 28px 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.row{flex-wrap:nowrap;align-items:flex-start}
label.row input[type=checkbox]{margin-top:4px;flex:none}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}
.span2{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2,.card h3{margin-bottom:10px}
.card .sub{margin:-4px 0 10px;color:var(--muted);font-size:13px}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
button{font:500 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.pri:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--bad)}
button.link{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input,textarea{font:14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f > *{color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right}
td.wrap{white-space:normal}
td input.simul{width:70px;text-align:right;font-family:var(--mono);padding:4px 6px}
td input.nota{width:62px;text-align:right;font-family:var(--mono);padding:4px 6px}
td input.nota.low{border-color:var(--bad);color:var(--bad)}
table.heat td.h{text-align:center;font-family:var(--mono);font-size:13px;min-width:56px}
table.heat th{white-space:normal;min-width:56px;vertical-align:bottom}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:transparent;color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.rec{background:var(--warn-bg);color:var(--warn)}
.pill.rep{background:var(--bad-bg);color:var(--bad)}
.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tag{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
svg text{fill:var(--muted);font:11px var(--mono)}
svg .ax{stroke:var(--line)}
.stats td{font-family:var(--mono)}
.stats td:first-child{font-family:var(--body);color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:10px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.q .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.q .enun{white-space:pre-wrap}
.q .enun.locked{color:var(--muted);font-style:italic;display:flex;gap:6px;align-items:center}
.q ol{margin:2px 0 0;padding-left:22px}
.q ol li.ok{color:var(--good);font-weight:600}
.d-fácil{color:var(--good)} .d-média{color:var(--warn)} .d-difícil{color:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--surface);border-radius:14px;padding:20px;width:min(680px,100%);display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.prova{background:#fff;color:#111;border-radius:6px;padding:36px 44px;font-family:Georgia,"Times New Roman",serif;line-height:1.55;border:1px solid var(--line)}
.prova h1{font-family:Georgia,serif;font-size:21px;text-align:center}
.prova .cab{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;border:1px solid #333;padding:10px 14px;margin:14px 0;font-size:14px}
.prova .it{margin:18px 0;break-inside:avoid}
.prova .alt{margin:4px 0 0 18px}
.prova .linhas{border-bottom:1px solid #999;height:26px}
.prova .gab{color:#1f6b52;font-weight:bold}
.prova .nova{font:11px var(--mono);color:#a86a00;margin-left:6px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note p{margin:0 0 6px} .note p:last-child{margin:0}
.aiout{white-space:pre-wrap;font-size:14px;line-height:1.6}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.toast{transition:none}}
.arch pre{font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;margin:0}
.arch ul,.arch ol{margin:0;padding-left:18px}
.arch li{margin:4px 0}
.arch p{margin:0 0 8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.yes{color:var(--good);font-weight:600} .no{color:var(--muted)}
table.wk{table-layout:fixed;min-width:820px} table.wk th:first-child{width:72px}
table.wk td{vertical-align:top;min-width:150px;white-space:normal;padding:6px}
.aula{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--tc);padding:6px 8px;margin-bottom:4px;background:var(--bg);border-radius:6px;font-size:13px;line-height:1.4;font-weight:400}
.aula.dada{opacity:.75} .aula.cancelada{opacity:.55;text-decoration:line-through}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.alt-btn{text-align:left;font-weight:400;background:var(--surface)}
.alt-btn:disabled{cursor:default;opacity:1}
.blocked{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:40px 20px;color:var(--muted)}
.qgrid{grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.gloss{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:6px 16px;margin:0;font-size:14px}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:var(--muted)}
.dom{display:inline-flex;gap:4px;align-items:center;border-radius:6px;padding:4px 9px;font-size:13px;border:1px solid var(--line)}
.dom.c{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.dom.d{background:color-mix(in srgb,var(--chart2) 14%,transparent);border-color:color-mix(in srgb,var(--chart2) 40%,transparent)}
.dom.n{border-style:dashed;color:var(--muted)}
.dom small{font-size:10px;color:var(--muted)}
section.card{scroll-margin-top:16px}
table.areas td{white-space:normal;vertical-align:top;padding:4px}
.cel{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:400;line-height:1.35;min-width:150px}
.addcel{width:100%;border:1px dashed var(--line)!important;color:var(--muted)!important;font-size:12px;padding:10px 4px!important}
.addcel:hover{color:var(--accent)!important;border-color:var(--accent)!important}
ul.simples{margin:10px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input[type=range]{accent-color:var(--accent);padding:0}
.brandrow{display:flex;align-items:center;justify-content:space-between}
.menubtn{display:none;color:var(--ink)!important}
details.adv{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.adv > summary{cursor:pointer;padding:14px 16px;font-family:var(--display);font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary::after{content:"Mostrar";font:500 13px var(--body);color:var(--accent)}
details.adv[open] > summary::after{content:"Ocultar"}
details.adv > .advbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px}
.explica{font-size:12px;color:var(--muted);margin-top:4px}
.hero{display:flex;flex-direction:column;gap:6px}
.hero p{margin:0;color:var(--muted);max-width:70ch}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps a{font-size:13px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--surface)}
.steps a b{color:var(--accent);margin-right:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .top .push{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;background:var(--surface)}
.chip input{margin:0}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fb button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.hint{font-size:12px;color:var(--muted);min-height:16px}
.hint b{color:var(--ink)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;z-index:10;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}
  .menubtn{display:inline-block;border:1px solid var(--line)}
  .school,.who .papel{display:none}
  .who{margin:6px 0}
  #navlinks{display:none}
  nav.side.open #navlinks{display:flex}
  .head{align-items:stretch}
  .head .row > *{flex:1 1 auto}
  .kpi .v{font-size:24px}
  .qgrid{grid-template-columns:1fr}
  .gloss{grid-template-columns:1fr}
  .gloss dd{margin-bottom:6px}
  .side .foot{display:none}
  main{padding:16px}
  .prova{padding:20px}
}

/* Cognix 2.0 – interface sóbria, hierarquia visual e navegação entre instituições */
:root{--bg:#f6f8fa;--surface:#ffffff;--ink:#152b2b;--muted:#61717a;--line:#e4e9ec;--accent:#167a61;--accent-soft:#eaf7f2;--accent-ink:white;--display:"Bricolage Grotesque",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101818;--surface:#192524;--ink:#edf6f1;--muted:#a3b4b0;--line:#2b3a39;--accent:#66d6ac;--accent-soft:#193b32;--accent-ink:#09231b}}
:root[data-theme="dark"]{--bg:#101818;--surface:#192524;--ink:#edf6f1;--muted:#a3b4b0;--line:#2b3a39;--accent:#66d6ac;--accent-soft:#193b32;--accent-ink:#09231b}
body{font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:252px minmax(0,1fr)}
nav.side{padding:24px 14px 16px;gap:9px;box-shadow:2px 0 12px rgba(25,45,45,.018)}
.brand{font-size:25px;letter-spacing:-.055em;padding:0 9px}.brand i{width:20px;height:20px;border-radius:6px;transform:rotate(-12deg);box-shadow:inset -6px -6px 0 rgba(255,255,255,.23)}
.school{padding:0 10px 12px;font-size:11px;letter-spacing:.015em}
.who{background:var(--bg);margin:0 0 8px;padding:14px;border-color:var(--line);border-radius:14px;gap:7px}
.who label.f{font-size:11px;letter-spacing:.02em;text-transform:uppercase;font-weight:600}
.who select{background:var(--surface);font-size:12px;padding:9px 8px;border-radius:9px;max-width:100%;text-transform:none;letter-spacing:0}
.who .papel{display:block;color:var(--muted);font-size:11px;line-height:1.4;letter-spacing:0}
.nav-group{margin:6px 0}.nav-group-title{padding:12px 12px 8px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
#navlinks{gap:1px}nav.side a{padding:10px 12px;margin:1px 0;font-weight:500;font-size:13px;border-radius:10px;gap:8px}
.navitem-label{display:inline-flex;align-items:center;gap:11px}.nav-icon{display:inline-flex;align-items:center;justify-content:center;color:var(--muted);width:19px;font-size:16px;font-weight:400}
nav.side a.on{font-weight:600}nav.side a.on .nav-icon{color:var(--accent)}
nav.side .foot{border-top:1px solid var(--line);padding:15px 8px;margin-top:auto;line-height:1.45}
main{padding:0 32px 48px;gap:20px;max-width:1640px;width:100%;margin:0 auto}
main > .head{padding-top:4px}h1{font-size:clamp(26px,3vw,34px);letter-spacing:-.055em}h2{font-size:18px;letter-spacing:-.025em}
.head{gap:14px}.head p{font-size:13px;max-width:85ch}.eyebrow{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:.14em;margin-bottom:4px;text-transform:uppercase}
.card{border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 4px 20px rgba(32,50,53,.025)}
.grid{gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpi{background:var(--surface)}.kpi .v{font-size:33px;letter-spacing:-.055em;padding:5px 0}.kpi .l{font-size:12px;font-weight:600}.kpi .s,.explica{font-size:12px;color:var(--muted)}
button,select,input,textarea{border-radius:9px}button{transition:background .15s,border-color .15s,transform .15s}button:active{transform:translateY(1px)}button.pri{box-shadow:0 2px 6px rgba(18,94,73,.12)}
.card .sub{font-size:12px;margin:-3px 0 15px}.item{border-radius:10px}.tablewrap{border-radius:9px}table{font-size:13px}th{font-size:10px;letter-spacing:.065em;background:var(--surface)}th,td{padding:11px 12px}tbody tr:hover{background:color-mix(in srgb,var(--accent) 3%,transparent)}
.workspace-bar{margin:0 -32px 4px;padding:15px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:75px;background:color-mix(in srgb,var(--surface) 93%,var(--bg));border-bottom:1px solid var(--line);flex-wrap:wrap}

/* ================= estatística ================= */
const S = {
  mean: a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : NaN,
  q(a,p){ if(!a.length) return NaN; const s=[...a].sort((x,y)=>x-y); const i=(s.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo); },
  median: a => S.q(a,.5),
  variance(a){ if(a.length<2) return NaN; const m=S.mean(a); return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1); },
  sd: a => Math.sqrt(S.variance(a)),
  dm(a){ const m=S.mean(a); return a.length ? a.reduce((s,x)=>s+Math.abs(x-m),0)/a.length : NaN; },
  skew(a){ const n=a.length; if(n<3) return NaN; const m=S.mean(a), s=S.sd(a); return n/((n-1)*(n-2))*a.reduce((t,x)=>t+((x-m)/s)**3,0); },
  mode(a){ const c={}; a.forEach(x=>{const k=(Math.round(x*2)/2).toFixed(1); c[k]=(c[k]||0)+1}); let b=null,n=0; for(const k in c) if(c[k]>n){n=c[k];b=+k} return b; },
  corr(x,y){ const mx=S.mean(x),my=S.mean(y); let a=0,b=0,c=0; for(let i=0;i<x.length;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2} return a/Math.sqrt(b*c); },
  describe(a){
    const m=S.mean(a), sd=S.sd(a), q1=S.q(a,.25), q3=S.q(a,.75);
    return {n:a.length, mean:m, median:S.median(a), mode:S.mode(a), sd, dm:S.dm(a), variance:S.variance(a), cv: sd/m*100,

function temasParecidos(nome, disc){

  const vistos=new Set();
  return usoTopicos().filter(x=>(!disc||x.disc===disc)).map(x=>({...x,k:normKey(x.nome)})).filter(x=>{
    if(x.k===k || vistos.has(x.k)) return false;
    const ok = (k.length>=5 && x.k.length>=5 && (x.k.includes(k)||k.includes(x.k))) || lev(k,x.k)<=2 || (k.split(" ")[0].length>=6 && k.split(" ")[0]===x.k.split(" ")[0]);
    if(ok) vistos.add(x.k); return ok;
  }).map(x=>temaOficial(x.nome,x.disc));

    for(let i=0;i<lista.length;i++) for(let j=i+1;j<lista.length;j++) if(parecidas(normKey(lista[i].nome),normKey(lista[j].nome))) pai[f(i)]=f(j);
    const g={}; lista.forEach((x,i)=>(g[f(i)]=g[f(i)]||[]).push(x));
    Object.values(g).filter(m=>m.length>1).forEach(membros=>{

  });

  Object.values(DB.historico).forEach(h=>Object.values(h).forEach(ano=>set.forEach(m=>{ if(m in ano){ ano[para]=ano[para]??ano[m]; delete ano[m]; } })));

/* quanto o aluno precisa tirar nas avaliações que faltam */
function precisa(t, aid){
  let feito=0, pFeito=0, pFalta=0; const faltam=[];
  t.avaliacoes.forEach(v=>{ const n=t.notas[aid]?.[v.id]; if(n!=null){ feito+=n*v.peso; pFeito+=v.peso; } else { pFalta+=v.peso; faltam.push(v); } });
  const tot=pFeito+pFalta, parcial = pFeito? feito/pFeito : null;
  const alvo = x => pFalta ? (x*tot - feito)/pFalta : null;
  return {parcial, faltam, pFalta, tot, feito, need:alvo(DB.mediaAprov), needRec:alvo(DB.mediaRec)};
}

function mediaAluno(t, a){
  let s=0, p=0;
  t.avaliacoes.forEach(v=>{ const n=t.notas[a.id]?.[v.id]; if(n!=null && !isNaN(n)){ s+=n*v.peso; p+=v.peso } });
  return p ? s/p : null;
}
function situacao(m){
  if (m==null) return ["n","Sem notas"];
  if (m>=DB.mediaAprov) return ["ok","Aprovado"];
  if (m>=DB.mediaRec) return ["rec","Recuperação"];
  return ["rep","Em risco"];
}
function notasDe(t, avId){
  return t.alunos.map(a => avId==="final" ? mediaAluno(t,a) : t.notas[a.id]?.[avId]).filter(x=>x!=null && !isNaN(x));
}
const QUEDA = 2.5;
/* queda brusca: nota de uma avaliação ≥ QUEDA pontos abaixo da média das anteriores do próprio aluno */
function quedas(t){
  const out=[];
  t.alunos.forEach(a=>{
    const seq=t.avaliacoes.map(v=>({v,n:t.notas[a.id]?.[v.id]})).filter(x=>x.n!=null);
    let best=null;
    for(let i=1;i<seq.length;i++){ const prev=S.mean(seq.slice(0,i).map(x=>x.n)), drop=prev-seq[i].n; if(drop>=QUEDA && (!best||drop>best.drop)) best={a,t,av:seq[i].v,de:prev,para:seq[i].n,drop}; }
    if(best) out.push(best);
  });
  return out.sort((x,y)=>y.drop-x.drop);
}
/* desempenho por tópico */
function temaAnalise(t){
  const temas=[...new Set(t.avaliacoes.flatMap(v=>v.temas||[]))];
  const porAluno={};
  t.alunos.forEach(a=>{ porAluno[a.id]={}; temas.forEach(m=>{ const vals=t.avaliacoes.filter(v=>(v.temas||[]).includes(m)).map(v=>t.temaNotas?.[a.id]?.[v.id]?.[m]).filter(x=>x!=null); if(vals.length) porAluno[a.id][m]=S.mean(vals); }); });
  const resumo=temas.map(m=>{
    const vals=t.alunos.map(a=>porAluno[a.id][m]).filter(x=>x!=null);
    const serie=t.avaliacoes.filter(v=>(v.temas||[]).includes(m)).map(v=>S.mean(t.alunos.map(a=>t.temaNotas?.[a.id]?.[v.id]?.[m]).filter(x=>x!=null))).filter(x=>!isNaN(x));
    const d=vals.length>1?S.describe(vals):null;
    return {tema:m, d, abaixo: vals.filter(x=>x<DB.mediaAprov).length/vals.length*100, tend: serie.length>1? serie[serie.length-1]-serie[0] : null, serie};
  }).filter(x=>x.d);
  return {temas:resumo.map(x=>x.tema), porAluno, resumo};
}
function diagnosticoTexto(t){
  const {resumo}=temaAnalise(t), q=quedas(t);
  const out=[];
  if(!resumo.length) return ["Ainda não há notas por tópico nesta turma."];
  const ord=[...resumo].sort((a,b)=>a.d.mean-b.d.mean), pior=ord[0];
  const outros=S.mean(resumo.filter(x=>x!==pior).map(x=>x.d.mean));
  const crit=ord.filter(x=>x.d.mean<DB.mediaAprov-0.05);
  if(resumo.length>1 && pior.d.mean < outros-0.8){
    out.push(`A dificuldade está concentrada em ${pior.tema}: média ${fmt(pior.d.mean,1)}, com ${fmt(pior.abaixo,0)}% da turma abaixo do mínimo, contra ${fmt(outros,1)} nos demais tópicos. É um problema de conteúdo específico, não da turma como um todo.`);
  } else if(crit.length===resumo.length){
    out.push(`As notas estão baixas em todos os tópicos de forma parecida. A dificuldade parece geral (ritmo, método ou base anterior), e não de um conteúdo específico.`);
  } else if(!crit.length){
    out.push(`Todos os tópicos estão com média acima de ${fmt(DB.mediaAprov,1)}. O tópico mais fraco é ${pior.tema} (${fmt(pior.d.mean,1)}).`);
  } else out.push(`Tópicos abaixo do mínimo: ${crit.map(x=>`${x.tema} (${fmt(x.d.mean,1)})`).join(", ")}.`);
  const caindo=resumo.filter(x=>x.tend!=null && x.tend<=-0.8);
  if(caindo.length) out.push(`Rendimento em queda ao longo do bimestre em ${caindo.map(x=>`${x.tema} (${fmt(x.tend,1)} ponto)`).join(", ")}.`);
  const disp=resumo.filter(x=>x.d.cv>30);
  if(disp.length) out.push(`Em ${disp.map(x=>x.tema).join(", ")} a turma está dividida (CV acima de 30%): vale agrupar alunos por nível ou oferecer monitoria.`);
  if(q.length) out.push(`${q.length} aluno(s) tiveram queda brusca, de ${fmt(QUEDA,1)} pontos ou mais em relação à própria média anterior. Recomenda-se conversa individual e aviso à orientação.`);
  return out;
}
const critSet = t => new Set(temaAnalise(t).resumo.filter(x=>x.d.mean<DB.mediaAprov-0.05).map(x=>x.tema));
function sugestoesAulas(t){
  const res=temaAnalise(t).resumo.sort((a,b)=>a.d.mean-b.d.mean), crit=res.filter(x=>x.d.mean<DB.mediaAprov-0.05), q=quedas(t);
  const prox=t.avaliacoes.filter(futura)[0];
  return aulasDaTurma(t.id).map((a,i,arr)=>{
    const isC = crit.some(c=>c.tema===a.topico); let sug;
    const fer=feriadoDe(DATAS[a.dia]);
    if(fer) sug = `Não haverá aula (${fer.nome}). Redistribua ${a.topico} nas próximas aulas.`;
    else if(a.status==="dada") sug = a.obs ? "Aula registrada. A anotação entra no diagnóstico com IA." : "Aula dada. Anote como foi para enriquecer o diagnóstico.";
    else if(a.status==="cancelada") sug = "Aula cancelada: redistribua o tópico nas próximas aulas.";
    else if(isC) sug = `Tópico crítico (média ${fmt(crit.find(c=>c.tema===a.topico).d.mean,1)}). Comece com 10 minutos de sondagem dos pré-requisitos e use questões fáceis antes das médias.`;
    else if(crit.length) sug = `Mantenha o plano e reserve 10 a 15 minutos para retomar ${crit[0].tema} (média ${fmt(crit[0].d.mean,1)}), que não está nesta aula.`;
    else sug = "Turma acima do mínimo em todos os tópicos: mantenha o planejado e aprofunde com questões difíceis.";
    if(i===arr.findIndex(x=>x.status==="planejada") && q.length) sug += ` Ao final, converse com ${q.slice(0,3).map(x=>x.a.nome.split(" ")[0]).join(", ")} (queda brusca).`;
    if(prox && i===arr.length-1) sug += ` Última aula antes de ${prox.nome} (${dataBR(prox.data)}): bom momento para revisão.`;
    return {a, crit:isC, sug};
  });
}

}

    g+=`<text x="${L-10}" y="${cy+4}" text-anchor="end" style="fill:var(--ink);font-family:var(--body);font-size:12px">${esc(nomeT(r.t))}</text>`;
    g+=`<rect x="${x(0)}" y="${cy-9}" width="${x(r.d.mean)-x(0)}" height="18" rx="3" fill="${col}" opacity=".85"><title>média ${fmt(r.d.mean)} · DP ${fmt(r.d.sd)}</title></rect>`;
    g+=`<line x1="${x(Math.max(0,r.d.mean-r.d.sd))}" x2="${x(Math.min(10,r.d.mean+r.d.sd))}" y1="${cy}" y2="${cy}" stroke="var(--ink)"/><line x1="${x(Math.max(0,r.d.mean-r.d.sd))}" x2="${x(Math.max(0,r.d.mean-r.d.sd))}" y1="${cy-5}" y2="${cy+5}" stroke="var(--ink)"/><line x1="${x(Math.min(10,r.d.mean+r.d.sd))}" x2="${x(Math.min(10,r.d.mean+r.d.sd))}" y1="${cy-5}" y2="${cy+5}" stroke="var(--ink)"/>`;
    g+=`<text x="${x(Math.min(10,r.d.mean+r.d.sd))+6}" y="${cy+4}" style="fill:var(--ink)">${fmt(r.d.mean,1)}</text>`;
  });
  g+=`<line x1="${x(DB.mediaAprov)}" x2="${x(DB.mediaAprov)}" y1="4" y2="${h-22}" stroke="var(--bad)" stroke-dasharray="5 4" opacity=".7"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Média por turma">${g}</svg><div class="legend"><span style="--c:var(--accent)">média da turma</span><span style="--c:var(--ink)">barra de ±1 desvio padrão</span><span style="--c:var(--bad)">mínimo ${fmt(DB.mediaAprov,1)}</span></div>`;
}
function spark(vals,w=90,h=24){
  const pts=vals.map((v,i)=>v==null?null:[4+(w-8)*i/(vals.length-1), h-3-(h-6)*v/10]).filter(Boolean);
  if(pts.length<2) return "";
  const last=pts[pts.length-1], down=vals.filter(v=>v!=null).slice(-1)[0] < vals.filter(v=>v!=null)[0]-1;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${h-3-(h-6)*DB.mediaAprov/10}" y2="${h-3-(h-6)*DB.mediaAprov/10}" class="ax" stroke-dasharray="2 2"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${down?"var(--bad)":"var(--accent)"}" stroke-width="1.6"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${down?"var(--bad)":"var(--accent)"}"/></svg>`;
}

const TIPOS_EV = ["Período","Semana de provas","Recuperação","Recesso","Feriado","Conselho de classe","Evento"];
function linhaDoTempo(cal, w=900){
  const ini=new Date("2026-02-01"), fim=new Date("2026-12-31"), W=w-20, x=d=>10+W*(new Date(d)-ini)/(fim-ini);
  const meses=["fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"]; let g="";
  meses.forEach((m,i)=>{ const d=`2026-${String(i+2).padStart(2,"0")}-01`; g+=`<line class="ax" x1="${x(d)}" x2="${x(d)}" y1="8" y2="78"/><text x="${x(d)+3}" y="92">${m}</text>`; });
  const cor={"Período":"var(--accent)","Recesso":"var(--muted)","Semana de provas":"var(--chart2)","Recuperação":"var(--warn)"};
  cal.filter(e=>e.tipo==="Período"||e.tipo==="Recesso").forEach(e=>{ g+=`<rect x="${x(e.inicio)}" y="16" width="${Math.max(3,x(e.fim)-x(e.inicio))}" height="18" rx="3" fill="${cor[e.tipo]}" opacity="${e.tipo==="Período"?.25:.35}"><title>${esc(e.nome)}</title></rect>${e.tipo==="Período"?`<text x="${x(e.inicio)+4}" y="29" style="fill:var(--ink)">${esc(e.nome.replace(" bimestre"," bim."))}</text>`:""}`; });
  cal.filter(e=>e.tipo==="Semana de provas"||e.tipo==="Recuperação").forEach(e=>{ g+=`<rect x="${x(e.inicio)}" y="40" width="${Math.max(4,x(e.fim)-x(e.inicio))}" height="12" rx="3" fill="${cor[e.tipo]}"><title>${esc(e.nome)}</title></rect>`; });
  cal.filter(e=>["Feriado","Evento","Conselho de classe"].includes(e.tipo)).forEach(e=>{ g+=`<circle cx="${x(e.inicio)}" cy="64" r="4" fill="${e.tipo==="Feriado"?"var(--bad)":"var(--ink)"}"><title>${dataBR(e.inicio)} · ${esc(e.nome)}</title></circle>`; });
  g+=`<line x1="${x(HOJE)}" x2="${x(HOJE)}" y1="6" y2="80" stroke="var(--ink)" stroke-dasharray="3 3"/><text x="${x(HOJE)-4}" y="12" text-anchor="end" style="fill:var(--ink)">hoje</text>`;
  return `<svg viewBox="0 0 ${w} 100" width="100%" role="img" aria-label="Linha do tempo do ano letivo">${g}</svg><div class="legend"><span style="--c:color-mix(in srgb,var(--accent) 30%,transparent)">bimestres</span><span style="--c:var(--chart2)">semana de provas</span><span style="--c:var(--warn)">recuperação</span><span style="--c:var(--bad)">feriado</span><span style="--c:var(--ink)">evento ou conselho</span></div>`;
}

    <tr><td></td><td class="muted">Média da avaliação</td>${t.avaliacoes.map(v=>`<td class="num mono muted">${fmt(S.mean(notasDe(t,v.id)),1)}</td>`).join("")}<td class="num mono"><b>${fmt(S.mean(notasDe(t,"final")),1)}</b></td><td></td></tr>
  </table></div></div>
  <p class="muted" style="font-size:13px;margin:0">Critérios da escola: aprovado com média ${fmt(DB.mediaAprov,1)} ou mais; recuperação a partir de ${fmt(DB.mediaRec,1)}.${coord?` Altere em <button class="link" onclick="location.hash='configuracoes'">Configurações</button>.`:""}</p>`;
};

const GLOSSARIO = [
  ["Média","Soma das notas dividida pelo número de alunos."],
  ["Mediana","Nota do meio quando as notas são ordenadas. Não é puxada por notas extremas."],
  ["Desvio padrão (DP)","Quanto as notas costumam se afastar da média. Quanto maior, mais diferentes os alunos estão entre si."],
  ["Desvio médio (DM)","Distância média de cada nota até a média, em pontos. Mais fácil de ler que o DP."],
  ["Coeficiente de variação (CV)","DP dividido pela média, em %. Abaixo de 15% a turma é homogênea; acima de 30%, bastante dividida."],
  ["Quartis (Q1 e Q3)","Metade central da turma fica entre Q1 e Q3."],
  ["Escore z","Quantos desvios padrão um aluno está acima (+) ou abaixo (−) da média."],
  ["Assimetria","Negativa: maioria com notas altas e poucas muito baixas. Positiva: o contrário."],
  ["Correlação","De −1 a 1. Perto de 1: alunos que vão bem numa avaliação tendem a ir bem na outra."]
];
V.desempenho = () => {
  const t = T();
  const feitas = t.avaliacoes.filter(v=>notasDe(t,v.id).length>1);
  const geral = notasDe(t,"final"), dg = S.describe(geral);
  const aprov = geral.filter(x=>x>=DB.mediaAprov).length/geral.length*100;
  const tend = feitas.length>1 ? S.mean(notasDe(t,feitas[feitas.length-1].id)) - S.mean(notasDe(t,feitas[0].id)) : null;
  const disp = dg.cv<15?"notas próximas entre si":dg.cv<30?"notas moderadamente espalhadas":"turma bastante dividida";
  const atencao = temaAnalise(t).resumo.sort((a,b)=>a.d.mean-b.d.mean).slice(0,3);
  // ---- análise avançada ----
  const opts = [["final","Média final ponderada"], ...feitas.map(v=>[v.id,v.nome])];
  if(!opts.some(o=>o[0]===ui.av)) ui.av="final";
  const {porAluno, temas} = temaAnalise(t);
  const temasAv = ui.av==="final" ? temas : (t.avaliacoes.find(v=>v.id===ui.av)?.temas||[]);
  if(ui.topF && !temasAv.includes(ui.topF)) ui.topF="";
  const grupo = al => { const m=mediaAluno(t,al); return !ui.grpF || (ui.grpF==="abaixo" ? m<DB.mediaAprov : m>=DB.mediaAprov); };
  const valor = al => ui.topF ? (ui.av==="final" ? porAluno[al.id]?.[ui.topF] : t.temaNotas?.[al.id]?.[ui.av]?.[ui.topF]) : (ui.av==="final" ? mediaAluno(t,al) : t.notas[al.id]?.[ui.av]);
  const sel = t.alunos.filter(grupo).map(al=>({al, v:valor(al)})).filter(x=>x.v!=null);
  const a = sel.map(x=>x.v), d = a.length>1 ? S.describe(a) : null;
  const alunosZ = d ? sel.map(r=>({...r, z:(r.v-d.mean)/d.sd})).sort((x,y)=>x.z-y.z) : [];
  if(!feitas.some(v=>v.id===ui.cmpA)) ui.cmpA=feitas[0]?.id; if(!feitas.some(v=>v.id===ui.cmpB)) ui.cmpB=feitas[feitas.length-1]?.id;
  const pares = t.alunos.map(al=>({al, a:t.notas[al.id]?.[ui.cmpA], b:t.notas[al.id]?.[ui.cmpB]})).filter(x=>x.a!=null&&x.b!=null).map(x=>({...x, dif:x.b-x.a}));
  const melhor = pares.filter(x=>x.dif>=0.5).length, pior = pares.filter(x=>x.dif<=-0.5).length;
  let corr="";
  if (feitas.length>1){
    corr = `<div class="card"><h2>Correlação entre avaliações</h2><div class="tablewrap"><table><tr><th></th>${feitas.map(v=>`<th class="num">${esc(v.nome.slice(0,10))}</th>`).join("")}</tr>
    ${feitas.map(v1=>`<tr><td>${esc(v1.nome)}</td>${feitas.map(v2=>{
      const xs=[],ys=[]; t.alunos.forEach(al=>{const p=t.notas[al.id]?.[v1.id],q=t.notas[al.id]?.[v2.id]; if(p!=null&&q!=null){xs.push(p);ys.push(q)}});
      const r = xs.length>2?S.corr(xs,ys):NaN;
      return `<td class="num mono" style="background:color-mix(in srgb,var(--accent) ${isNaN(r)?0:Math.max(0,r)*40}%,transparent)">${fmt(r)}</td>`}).join("")}</tr>`).join("")}</table></div></div>`;
  }
  return `
  <div class="head"><div><h1>Desempenho</h1><p>${esc(nomeT(t))} · ${esc(profNome(t))} · ${dg.n} alunos com nota</p></div><div class="row">${turmaSelect()}</div></div>
  <div class="grid g4">
    <div class="card kpi"><div class="l">Média da turma</div><div class="v">${fmt(dg.mean,1)}</div><div class="explica">Média parcial ponderada pelos pesos das avaliações.</div></div>
    <div class="card kpi"><div class="l">Acima do mínimo</div><div class="v" style="color:${aprov<50?"var(--bad)":"inherit"}">${fmt(aprov,0)}%</div><div class="explica">${geral.filter(x=>x>=DB.mediaAprov).length} de ${dg.n} alunos com média ${fmt(DB.mediaAprov,1)} ou mais.</div></div>
    <div class="card kpi"><div class="l">Dispersão</div><div class="v">${fmt(dg.dm,1)} pt</div><div class="explica">Em média, cada aluno está a ${fmt(dg.dm,1)} ponto(s) da média: ${disp}.</div></div>
    <div class="card kpi"><div class="l">Tendência</div><div class="v" style="color:${tend!=null&&tend<=-0.8?"var(--bad)":"inherit"}">${tend==null?"—":(tend>0?"+":"")+fmt(tend,1)}</div><div class="explica">Diferença entre a média da última e a da primeira avaliação.</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h2>Evolução ao longo do bimestre</h2>${evolution(t)}</div>
    <div class="card"><h2>Tópicos que exigem atenção</h2><p class="sub">Os três tópicos com menor média nesta turma.</p>
      <div class="list">${atencao.map(r=>`<div class="item"><div class="top"><b>${esc(r.tema)}</b><span class="push mono">${fmt(r.d.mean,1)}</span>${r.d.mean<DB.mediaAprov-0.05?'<span class="pill rec">abaixo do mínimo</span>':""}</div><div class="muted" style="font-size:13px">${fmt(r.abaixo,0)}% da turma abaixo de ${fmt(DB.mediaAprov,1)}${r.tend!=null?` · no bimestre: ${Math.abs(r.tend)<0.05?"estável":(r.tend>0?"+":"")+fmt(r.tend,1)}`:""}</div></div>`).join("")}</div>
      <p style="margin:10px 0 0"><button class="link" onclick="location.hash='diagnostico'">Ver diagnóstico por tópico</button></p></div>
  </div>
  <details class="adv" id="advDes" ${ui.advOpen?"open":""}><summary>Análise avançada</summary><div class="advbody">
    <div class="row">
      <label class="f">Avaliação<select id="selAv">${opts.map(o=>`<option value="${o[0]}" ${o[0]===ui.av?"selected":""}>${esc(o[1])}</option>`).join("")}</select></label>
      <label class="f">Tópico<select id="selTop"><option value="">Todos</option>${temasAv.map(m=>`<option ${m===ui.topF?"selected":""}>${esc(m)}</option>`).join("")}</select></label>
      <label class="f">Alunos<select id="selGrp"><option value="">Todos</option><option value="abaixo" ${ui.grpF==="abaixo"?"selected":""}>Média abaixo do mínimo</option><option value="acima" ${ui.grpF==="acima"?"selected":""}>Média acima do mínimo</option></select></label>
    </div>
    ${!d?'<p class="muted">Poucos dados com esses filtros para calcular estatísticas.</p>':`
    <div class="note">Com esses filtros: ${d.n} notas, média ${fmt(d.mean,1)}, metade central entre ${fmt(d.q1,1)} e ${fmt(d.q3,1)}, assimetria ${fmt(d.skew)}.</div>
    <div class="grid g2">
      <div class="card"><h2>Distribuição das notas</h2>${histogram(a)}<div class="legend"><span style="--c:var(--bad)">abaixo de ${fmt(DB.mediaRec,1)}</span><span style="--c:var(--warn)">recuperação</span><span style="--c:var(--accent)">acima do mínimo</span></div></div>
      <div class="card"><h2>Medidas descritivas</h2><table class="stats">
        ${[["Nº de notas",d.n,0],["Média",d.mean],["Mediana",d.median],["Moda (arred. 0,5)",d.mode,1],["Mínimo · máximo",null,0,`${fmt(d.min)} · ${fmt(d.max)}`],["Amplitude",d.amp],["Q1 · Q3",null,0,`${fmt(d.q1)} · ${fmt(d.q3)}`],["Desvio médio",d.dm],["Desvio padrão",d.sd],["Variância",d.variance],["Coef. de variação (%)",d.cv],["Assimetria",d.skew]].map(r=>`<tr><td>${r[0]}</td><td class="num">${r[3]??fmt(r[1],r[2]??2)}</td></tr>`).join("")}
      </table></div>
      <div class="card"><h2>Comparar avaliações</h2><p class="sub">Mesmos alunos em duas avaliações.</p>
        <div class="row"><label class="f">De<select id="cmpA">${feitas.map(v=>`<option value="${v.id}" ${v.id===ui.cmpA?"selected":""}>${esc(v.nome)}</option>`).join("")}</select></label><label class="f">Para<select id="cmpB">${feitas.map(v=>`<option value="${v.id}" ${v.id===ui.cmpB?"selected":""}>${esc(v.nome)}</option>`).join("")}</select></label></div>
        ${pares.length?`<table class="stats" style="margin-top:8px"><tr><td>Média</td><td class="num">${fmt(S.mean(pares.map(x=>x.a)),1)} → ${fmt(S.mean(pares.map(x=>x.b)),1)}</td></tr><tr><td>Melhoraram (0,5+)</td><td class="num">${melhor} alunos</td></tr><tr><td>Pioraram (0,5+)</td><td class="num">${pior} alunos</td></tr><tr><td>Estáveis</td><td class="num">${pares.length-melhor-pior} alunos</td></tr></table>
        <p class="muted" style="font-size:13px;margin:8px 0 0">Maiores quedas: ${pares.sort((x,y)=>x.dif-y.dif).slice(0,3).map(x=>`${esc(x.al.nome.split(" ")[0])} (${fmt(x.dif,1)})`).join(", ")}.</p>`:'<p class="muted">Sem alunos com as duas notas.</p>'}</div>
      <div class="card"><h2>Boxplot por avaliação</h2>${boxplots(t)}</div>
      <div class="card"><h2>Escore z</h2><div class="tablewrap" style="max-height:320px;overflow:auto"><table>
        <tr><th>Aluno</th><th class="num">Nota</th><th class="num">z</th></tr>
        ${alunosZ.map(r=>`<tr><td>${esc(r.al.nome)}</td><td class="num mono">${fmt(r.v,1)}</td><td class="num mono" style="color:${r.z<-1?"var(--bad)":"inherit"}">${r.z>0?"+":""}${fmt(r.z)}</td></tr>`).join("")}
      </table></div></div>
      ${corr}
    </div>`}
    <div class="card"><h2>O que significam os indicadores</h2><dl class="gloss">${GLOSSARIO.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl></div>
  </div></details>`;
};

V.diagnostico = () => {
  const t = T();
  const {temas, porAluno, resumo} = temaAnalise(t);
  const q = quedas(t), qIds = new Set(q.map(x=>x.a.id));
  const txt = diagnosticoTexto(t);
  const ia = ui.diagIA[t.id];
  const alunosOrd = [...t.alunos].sort((a,b)=>(mediaAluno(t,a)??99)-(mediaAluno(t,b)??99));
  return `
  <div class="head"><div><h1>Diagnóstico por tópico</h1><p>${esc(nomeT(t))}. Mostra se a dificuldade é da turma toda ou de um conteúdo específico.</p></div><div class="row">${turmaSelect()}</div></div>
  <div class="note">${txt.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
  <div class="grid g2">
    <div class="card span2"><h2>Resumo por tópico</h2><div class="tablewrap"><table>
      <tr><th>Tópico</th><th class="num">Média</th><th class="num">DP</th><th class="num">DM</th><th class="num">Abaixo do mín.</th><th>Tendência</th></tr>
      ${resumo.sort((a,b)=>a.d.mean-b.d.mean).map(r=>`<tr><td>${esc(r.tema)}</td><td class="num" style="${heat(r.d.mean)}">${fmt(r.d.mean,1)}</td><td class="num">${fmt(r.d.sd)}</td><td class="num">${fmt(r.d.dm)}</td><td class="num">${fmt(r.abaixo,0)}%</td>
      <td>${r.tend==null?'<span class="muted">1 avaliação</span>':`${spark(r.serie,70,22)} <span class="mono" style="color:${r.tend<=-0.8?"var(--bad)":r.tend>=0.8?"var(--good)":"var(--muted)"}">${r.tend>0?"+":""}${fmt(r.tend,1)}</span>`}</td></tr>`).join("")}
    </table></div></div>
    <div class="card"><h2>Próximas aulas desta turma</h2><p class="sub">Sugestões automáticas cruzando a agenda com o diagnóstico.</p>
      ${sugestoesAulas(t).map(x=>`<div class="q" style="margin-bottom:8px"><div class="meta"><span class="tag">${esc(aulaQuando(x.a))}</span><b>${esc(x.a.topico)}</b>${x.crit?'<span class="pill rep">crítico</span>':""}${x.a.status!=="planejada"?`<span class="pill ${x.a.status==="dada"?"ok":"n"}">${x.a.status}</span>`:""}</div>${x.a.obs?`<div class="muted" style="font-size:13px">Anotação: ${esc(x.a.obs)}</div>`:""}<div style="font-size:14px">${esc(x.sug)}</div></div>`).join("")||'<p class="muted">Nenhuma aula desta turma na agenda.</p>'}
    </div>
    <div class="card"><h2>Diagnóstico com IA</h2><p class="sub">Considera notas, tópicos e as aulas da semana com suas anotações. A IA recebe códigos de aluno, nunca nomes.</p>
      <div class="row"><button class="pri" id="diagIA">Aprofundar diagnóstico com IA</button><span id="diagSt" class="muted" style="font-size:13px"></span></div>
      ${ia?`<div class="aiout" style="margin-top:12px">${esc(ia)}</div>`:'<p class="muted" style="margin-top:12px">Gere recomendações de intervenção para este diagnóstico: o que retomar, com quem e em que ordem.</p>'}
    </div>
    <div class="card span2"><h2>Mapa de calor: aluno × tópico</h2><p class="sub">Média de cada aluno nas questões de cada tópico. Ordenado da menor para a maior média final. Linhas marcadas tiveram queda brusca.</p>
      <div class="tablewrap" style="max-height:520px;overflow:auto"><table class="heat"><tr><th>Aluno</th>${temas.map(m=>`<th>${esc(m)}</th>`).join("")}<th class="num">Média final</th></tr>
      ${alunosOrd.map(a=>`<tr><td>${esc(a.nome)} ${qIds.has(a.id)?'<span class="pill rep" title="Queda brusca">queda</span>':""}</td>${temas.map(m=>{const v=porAluno[a.id][m]; return `<td class="h" style="${heat(v)}">${fmt(v,1)}</td>`}).join("")}<td class="num mono"><b>${fmt(mediaAluno(t,a),1)}</b></td></tr>`).join("")}
      </table></div><div class="legend"><span style="--c:color-mix(in srgb,var(--bad) 40%,transparent)">abaixo de ${fmt(DB.mediaRec,1)}</span><span style="--c:color-mix(in srgb,var(--warn) 35%,transparent)">recuperação</span><span style="--c:color-mix(in srgb,var(--accent) 35%,transparent)">8 ou mais</span></div></div>
  </div>`;
};

V.trilha = () => {
  const lista = alunos3();
  if(!lista.length) return `<div class="head"><h1>Trilha ENEM</h1></div><div class="card muted">Você não tem turmas de 3ª série.</div>`;
  if(!lista.some(a=>a.id===ui.alunoTrilha)) ui.alunoTrilha=lista[0].id;
  const al = lista.find(a=>a.id===ui.alunoTrilha);
  const tr = trilhaAluno(al.id);
  // mapa da série
  const todos = lista.map(a=>({a, tr:trilhaAluno(a.id)}));
  const temas = [...new Set(todos.flatMap(x=>x.tr.map(r=>r.tema)))];
  const mapa = temas.map(m=>{ const anos=ANOS.map((_,i)=>S.mean(todos.map(x=>x.tr.find(r=>r.tema===m)?.vals[i]).filter(v=>v!=null))); const alta=todos.filter(x=>x.tr.find(r=>r.tema===m)?.nivel==="alta").length; return {m, anos, alta}; }).sort((a,b)=>b.alta-a.alta);
  const plano = ui.planoIA[al.id];
  return `
  <div class="head"><div><h1>Trilha ENEM · 3ª série</h1><p>Histórico desde o 9º ano para direcionar a revisão de forma cirúrgica. ${P().tipo==="prof"?`Mostrando tópicos de ${esc(discVis().join(" e "))}.`:"Todas as disciplinas."}</p></div>
    <div class="row"><label class="f">Aluno<select id="selAl">${lista.map(a=>`<option value="${a.id}" ${a.id===al.id?"selected":""}>${esc(a.nome)}</option>`).join("")}</select></label></div></div>
  <div class="grid g2">
    <div class="card span2"><h2>${esc(al.nome)}: prioridades de revisão</h2><p class="sub">Domínio = média ponderada pelos anos (anos recentes pesam mais). Tendência = última nota menos a primeira.</p>
      <div class="tablewrap"><table><tr><th>Tópico</th>${ANOS.map(a=>`<th class="num">${a.replace(" série","")}</th>`).join("")}<th>Evolução</th><th class="num">Domínio</th><th>Prioridade</th></tr>
      ${tr.map(r=>`<tr><td>${esc(r.tema)}<br><span class="muted" style="font-size:12px">${esc(r.disc)}</span></td>${r.vals.map(v=>`<td class="num mono" style="${heat(v)}">${fmt(v,1)}</td>`).join("")}<td>${spark(r.vals)}</td><td class="num mono"><b>${fmt(r.dom,1)}</b></td><td><span class="pill ${r.nivel==="alta"?"rep":r.nivel==="média"?"rec":"ok"}">${r.nivel}</span></td></tr>`).join("")}
      </table></div></div>
    <div class="card span2"><h2>Plano de revisão</h2><p class="sub">Quatro semanas focadas nos tópicos de prioridade alta, usando questões do banco.</p>
      <div class="row"><button class="pri" id="planoIA">Gerar plano com IA</button><button id="planoLocal">Plano por regras</button><span id="planoSt" class="muted" style="font-size:13px"></span></div>
      ${plano?renderPlano(plano):'<p class="muted" style="margin-top:12px">Nenhum plano gerado para este aluno ainda.</p>'}</div>
    <div class="card span2"><h2>Mapa da 3ª série</h2><p class="sub">Média da série em cada tópico, ano a ano, e quantos alunos têm o tópico como prioridade alta.</p>
      <div class="tablewrap"><table><tr><th>Tópico</th>${ANOS.map(a=>`<th class="num">${a}</th>`).join("")}<th>Evolução</th><th class="num">Prioridade alta</th></tr>
      ${mapa.map(r=>`<tr><td>${esc(r.m)}</td>${r.anos.map(v=>`<td class="num mono" style="${heat(v)}">${fmt(v,1)}</td>`).join("")}<td>${spark(r.anos.map(v=>isNaN(v)?null:v))}</td><td class="num">${r.alta?`<span class="pill rep">${r.alta} alunos</span>`:'<span class="muted">0</span>'}</td></tr>`).join("")}
      </table></div></div>
  </div>`;
};
function renderPlano(p){
  return `<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
    ${p.resumo?`<div class="note">${esc(p.resumo)}</div>`:""}
    <div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">${(p.semanas||[]).map(s=>`<div class="q"><div class="meta"><span class="tag">Semana ${esc(s.semana)}</span><b>${esc(s.foco)}</b></div><ul style="margin:0;padding-left:18px">${(s.atividades||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ul>${s.questoes?.length?`<div class="muted" style="font-size:12px">Questões do banco: ${s.questoes.map(esc).join(", ")}</div>`:""}</div>`).join("")}</div>
    <div class="muted" style="font-size:12px">${p.fonte==="ia"?"Gerado pela IA a partir de dados pseudonimizados.":"Gerado por regras do sistema."}</div></div>`;
}

function qCard(q){
  const ver = podeVerConteudo(q);
  const edit = ver;
  return `<div class="q"><div class="meta"><span class="tag">${q.id}</span><b>${esc(q.tema)}</b><span class="muted">· ${esc(q.disciplina)} · ${TIPOS[q.tipo]} · </span><span class="d-${q.dificuldade}">${q.dificuldade}</span>${q.bloom?`<span class="tag">${esc(q.bloom)}</span>`:""}<span class="tag">${esc(q.fonte||"Escola")}</span>${q.origem==="ia"?'<span class="tag" style="color:var(--warn)">elaborada por IA</span>':""}${q.cat==="ia"?'<span class="tag" style="color:var(--accent)">categorizada por IA</span>':q.cat==="regras"?'<span class="tag">categorizada por regras</span>':""}

function loadDocx(){ if(window.docx) return Promise.resolve(window.docx); if(!docxPromise) docxPromise=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"; s.onload=()=>res(window.docx); s.onerror=()=>{docxPromise=null;rej(new Error("docx"))}; document.head.appendChild(s); }); return docxPromise; }
async function provaDocx(p){
  const d = await loadDocx(); const {Document,Packer,Paragraph,TextRun,AlignmentType,PageBreak} = d;
  const t = turmaById(p.turma), L="abcdefgh", F="Times New Roman";
  const par = (text,o={}) => new Paragraph({spacing:{after:o.after??80}, alignment:o.align, indent:o.indent?{left:o.indent}:undefined, children:[new TextRun({text, bold:o.bold, italics:o.italic, size:o.size||24, font:F})]});
  const ch = [
    par(p.titulo,{bold:true,size:30,align:AlignmentType.CENTER,after:200}),
    par(`Escola: ${DB.escola}        Turma: ${t.nome}        Disciplina: ${t.disciplina}`),
    par(`Aluno(a): ________________________________________        Data: ____/____/______`),
    par(`Valor: ${fmt(totalPts(p),1)} pontos        Professor(a): ${profNome(t)}`,{after:200}),
    par(p.instrucoes||"Leia com atenção. Responda a caneta. Questões discursivas devem apresentar o desenvolvimento.",{italic:true,after:240})
  ];
  p.itens.forEach((q,i)=>{
    ch.push(new Paragraph({spacing:{before:200,after:80},children:[new TextRun({text:`Questão ${i+1} `,bold:true,size:24,font:F}),new TextRun({text:`(${fmt(ptsOf(p,i),1)} pt)`,size:20,font:F})]}));
    q.enunciado.split("\n").forEach(l=>ch.push(par(l)));
    if(q.tipo==="multipla") q.alternativas.forEach((a,j)=>ch.push(par(`${L[j]}) ${a}`,{indent:360})));
    else if(q.tipo==="vf") ch.push(par("(   ) Verdadeiro        (   ) Falso",{indent:360}));
    else for(let k=0;k<5;k++) ch.push(par("_____________________________________________________________________________",{after:120}));
  });
  ch.push(new Paragraph({children:[new PageBreak()]}));
  ch.push(par(`Gabarito · ${p.titulo}`,{bold:true,size:28,after:200}));
  p.itens.forEach((q,i)=>ch.push(par(`${i+1}) ${q.tipo==="multipla"?L[+q.resposta]+") "+(q.alternativas[+q.resposta]||""):q.tipo==="vf"?(q.resposta==="0"?"Verdadeiro":"Falso"):q.resposta}`)));
  const doc = new Document({creator:profNome(t), title:p.titulo, sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:ch}]});
  return Packer.toBlob(doc);
}

const OBJETIVOS = {
  "Ainda não sei": {},
  "Medicina e saúde": {"Ciências da Natureza e suas Tecnologias":1.6,"Matemática e suas Tecnologias":1.1},
  "Engenharias e exatas": {"Matemática e suas Tecnologias":1.6,"Ciências da Natureza e suas Tecnologias":1.3},
  "Direito e humanas": {"Ciências Humanas e suas Tecnologias":1.6,"Linguagens, Códigos e suas Tecnologias":1.4},
  "Comunicação e letras": {"Linguagens, Códigos e suas Tecnologias":1.6,"Ciências Humanas e suas Tecnologias":1.2}
};
const AREA_CURTA = {"Matemática e suas Tecnologias":"Matemática","Ciências da Natureza e suas Tecnologias":"Ciências da Natureza","Linguagens, Códigos e suas Tecnologias":"Linguagens","Ciências Humanas e suas Tecnologias":"Ciências Humanas"};
const ATIVIDADES = ["Resolver problemas com cálculos","Programar e lidar com tecnologia","Fazer experimentos","Entender o corpo humano","Natureza e meio ambiente","Ler, escrever e argumentar","Entender a sociedade e a política","Cuidar e ajudar pessoas","Criar e comunicar ideias","Mapas, cidades e território"];
const MOTIVOS = ["Não sabia o conteúdo","Erro de cálculo","Interpretação do enunciado","Falta de atenção","Tempo"];
const agoraISO = () => { const d=new Date(), p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const diasDesde = iso => Math.max(0, Math.floor((new Date(agoraISO()) - new Date(iso))/864e5));
const SEMANA = "2026-11-16";
const semanaAnt = "2026-11-09";
const respDe = aid => (DB.respostas[aid] = DB.respostas[aid] || []);
const perfilDe = aid => { const pad={curso:"Medicina e saúde", horas:8, gosta:["Biologia","Química"], atividades:["Entender o corpo humano","Fazer experimentos","Cuidar e ajudar pessoas"], problema:"", valores:["Ajudar pessoas","Pesquisa e descoberta"], ambientes:["Hospital ou clínica","Laboratório"], pesoDes:40}; const o=DB.perfilAluno[aid]||(DB.perfilAluno[aid]={}); for(const k in pad) if(o[k]==null) o[k]=pad[k]; return o; };
function porTema(lst){ const o={}; lst.forEach(x=>{ const k=temaOficial(x.tema,x.disc); const t=o[k]||(o[k]={ok:0,tot:0,ult:null,disc:x.disc}); t.tot++; if(x.ok) t.ok++; if(!t.ult||x.data>t.ult) t.ult=x.data; }); return o; }
const taxa = l => l.length ? l.filter(x=>x.ok).length/l.length*100 : null;
/* domínio por tópico: histórico escolar + prática */
function recomendacoes(aid){
  const pf = perfilDe(aid), pesos = OBJETIVOS[pf.curso]||{}, pr = porTema(respDe(aid));
  return trilhaAluno(aid).map(r=>{
    const area=areaDe(r.disc), peso=pesos[area]||1, p=pr[r.tema];
    const tx = p && p.tot ? p.ok/p.tot : null, fator = tx==null?1.1:1.3-tx*0.6;
    const nn = r.vals.filter(v=>v!=null), osc = nn.length>2 ? S.sd(nn) : 0;
    const porque=[];
    if(r.dom!=null) porque.push(`domínio ${fmt(r.dom,1)}`);
    if(r.tend!=null && r.tend<=-0.8){ const i0=r.vals.findIndex(v=>v!=null); porque.push(`caiu de ${fmt(r.vals[i0],1)} (${ANOS[i0]}) para ${fmt(nn[nn.length-1],1)}`); }
    else if(osc>1) porque.push("resultado oscila entre os anos");
    if(tx!=null) porque.push(`na prática, ${p.ok} acerto(s) em ${p.tot}`); else porque.push("pouco praticado aqui");
    if(peso>1) porque.push(`peso alto para ${pf.curso.toLowerCase()}`);
    const nDados = nn.length + (p?.tot||0);
    const status = !nn.length && !p ? "não estudado" : (r.dom>=7 && (r.tend==null||r.tend>-1) && (tx==null||tx>=0.7)) ? "consolidado" : "em desenvolvimento";
    return {...r, area, peso, score:r.prio*peso*fator, porque, tx, pr:p, osc, nDados, status};
  }).sort((a,b)=>b.score-a.score);
}
function mensagemPessoal(recs){
  const fortes = recs.filter(r=>r.dom!=null && r.nDados>=3).sort((a,b)=>(b.dom-b.osc*0.5)-(a.dom-a.osc*0.5));
  const best=fortes[0], worst=recs.find(r=>r!==best && r.nDados>=1);
  if(!best||!worst) return "Ainda há poucos dados para uma recomendação firme. Resolva algumas questões para a trilha ficar mais precisa.";
  const verbo = worst.tend!=null&&worst.tend<=-0.8 ? "vem perdendo rendimento" : worst.osc>1 ? "ainda oscila" : "ainda precisa de reforço";
  return `Você demonstra consistência em ${best.tema}, mas ${verbo} em ${worst.tema}. Sua próxima etapa sugerida é revisar ${worst.tema} e resolver uma sequência curta de questões.`;
}
/* metas semanais */
function gerarMetas(aid, forcar){
  const m = DB.metas[aid];
  if(m && m.semana===SEMANA && !forcar) return m;
  const recs = recomendacoes(aid), pf=perfilDe(aid), r1_=recs[0], r2=recs[1];
  const erradas = pendentesErros(aid), temaErr = erradas[0]?.tema;
  const itens = [
    {id:uid("mt"), tipo:"revisar", tema:r1_.tema, txt:`Revisar a teoria de ${r1_.tema} e fazer um resumo de uma página`, feito:false},
    {id:uid("mt"), tipo:"questoes", tema:r1_.tema, alvo:5, txt:`Resolver 5 questões de ${r1_.tema}`},
    {id:uid("mt"), tipo:"questoes", tema:r2.tema, alvo:4, txt:`Resolver 4 questões de ${r2.tema}`},
    ...(temaErr?[{id:uid("mt"), tipo:"refazer", tema:temaErr, alvo:Math.min(3,erradas.filter(e=>e.tema===temaErr).length), txt:`Refazer as questões erradas de ${temaErr}`}]:[]),
    {id:uid("mt"), tipo:"simulado", alvo:1, txt:"Fazer um simulado curto e equilibrado (5 questões)"}
  ].slice(0, pf.horas<5?3:pf.horas<10?5:5);
  return (DB.metas[aid] = {semana:SEMANA, criadas:agoraISO(), itens});
}
function progressoMeta(aid, m){
  const sem = respDe(aid).filter(x=>x.data>=SEMANA);
  if(m.tipo==="revisar") return {v:m.feito?1:0, alvo:1};
  if(m.tipo==="questoes") return {v:Math.min(m.alvo, sem.filter(x=>temaOficial(x.tema,x.disc)===m.tema).length), alvo:m.alvo};
  if(m.tipo==="refazer") return {v:Math.min(m.alvo, sem.filter(x=>temaOficial(x.tema,x.disc)===m.tema && x.ok && x.tentativa>1).length), alvo:m.alvo};
  if(m.tipo==="simulado") return {v:Math.min(1,(DB.sessoes[aid]||[]).filter(s=>s.tipo==="simulado"&&s.data>=SEMANA).length), alvo:1};
  return {v:0,alvo:1};
}
/* erros pendentes: última tentativa da questão foi erro */
function pendentesErros(aid){
  const ult={}; respDe(aid).forEach((x,i)=>{ if(!ult[x.qid]||x.data>=ult[x.qid].data) ult[x.qid]={...x, idx:i}; });
  return Object.values(ult).filter(x=>!x.ok).map(x=>({...x, tema:temaOficial(x.tema,x.disc)})).sort((a,b)=>a.data.localeCompare(b.data));
}
function filaRevisao(aid){
  const recs = recomendacoes(aid), lst = respDe(aid), out = {};
  lst.filter(x=>diasDesde(x.data)<=30).forEach(x=>{ const k=temaOficial(x.tema,x.disc); const o=out[k]||(out[k]={tema:k, disc:x.disc, erros:0, tot:0, ult:x.data}); o.tot++; if(!x.ok) o.erros++; if(x.data>o.ult) o.ult=x.data; });
  return Object.values(out).map(o=>{ const r=recs.find(x=>x.tema===o.tema), dias=diasDesde(o.ult);
    return {...o, dias, dom:r?.dom, score:o.erros*2 + Math.min(dias,14)/2 + (r&&r.dom<6?2:0)}; }).filter(o=>o.erros>0||o.dias>=7).sort((a,b)=>b.score-a.score);
}
const poolAluno = aid => DB.questoes.filter(q=>q.tipo!=="discursiva" && turmasAluno(aid).some(t=>t.disciplina===q.disciplina));
function iniciarSessao(tipo, qids, rotulo){

  if(location.hash!=="#praticar") location.hash="praticar"; else { render(); window.scrollTo(0,0); }
}
function questoesDoTema(aid, tema, n=5){
  const pool=poolAluno(aid).filter(q=>temaOficial(q.tema,q.disciplina)===tema), ord={"fácil":0,"média":1,"difícil":2};
  const err=new Set(pendentesErros(aid).map(e=>e.qid));
  return pool.sort((a,b)=>(err.has(b.id)-err.has(a.id))||ord[a.dificuldade]-ord[b.dificuldade]).slice(0,n).map(q=>q.id);
}

function cursosSugeridos(aid){
  const pf=perfilDe(aid), recs=recomendacoes(aid), fb=DB.cursosFb[aid]||{};
  const domDisc = d => S.mean(recs.filter(r=>r.disc===d && r.dom!=null).map(r=>r.dom));
  const geral = S.mean(recs.filter(r=>r.dom!=null).map(r=>r.dom));
  return CURSOS.map(c=>{
    const desemp = S.mean(c.disc.map(domDisc).filter(x=>!isNaN(x)));
    const ativ = c.ativ.filter(a=>pf.atividades.includes(a)), gosta = c.disc.filter(d=>pf.gosta.includes(d));
    const sDes = clamp(((desemp-geral)+2)/4,0,1), sInt = Math.min(1, ativ.length/2*0.7 + gosta.length*0.3);
    const motivos = [];
    if(ativ.length) motivos.push(`você marcou interesse em ${ativ.map(a=>a.toLowerCase()).join(" e ")}`);
    if(gosta.length) motivos.push(`você disse que gosta de ${gosta.join(" e ")}`);
    if(!isNaN(desemp)) motivos.push(`seu desempenho em ${c.disc.join(" e ")} é ${fmt(desemp,1)}, ${desemp>=geral+0.2?"acima":desemp<=geral-0.2?"abaixo":"perto"} da sua média geral (${fmt(geral,1)})`);
    return {...c, score: sInt*0.6 + sDes*0.4, motivos, fb:fb[c.id]||""};
  }).sort((a,b)=>(a.fb==="nao")-(b.fb==="nao") || (b.fb==="sim")-(a.fb==="sim") || b.score-a.score);

function agendaEstudos(recs, horas){
  const blocos=Math.max(1,Math.round(horas*60/50)), top=recs.slice(0,5), tot=top.reduce((s,r)=>s+r.score,0)||1;
  const cotas=top.map(r=>({r, n:Math.max(1,Math.round(blocos*r.score/tot))}));
  let soma=cotas.reduce((s,c)=>s+c.n,0); while(soma>blocos){ const c=cotas.filter(c=>c.n>1).sort((a,b)=>a.r.score-b.r.score)[0]; if(!c) break; c.n--; soma--; }
  const fila=[]; const etapas=["revisar a teoria e fazer um resumo","resolver exercícios do banco","fazer uma questão ENEM cronometrada"];
  cotas.forEach(c=>{ for(let k=0;k<c.n;k++) fila.push({tema:c.r.tema, disc:c.r.disc, etapa:etapas[Math.min(k,2)]}); });
  const dias=["Seg","Ter","Qua","Qui","Sex","Sáb"], porDia=dias.map(()=>[]);
  // intercala tópicos para não repetir o mesmo no dia
  fila.sort((a,b)=>etapas.indexOf(a.etapa)-etapas.indexOf(b.etapa)).forEach((b,i)=>porDia[i%6].push(b));
  return dias.map((d,i)=>({d, blocos:porDia[i]}));
}

function cursosVocacao(aid){
  const pf=perfilDe(aid), recs=recomendacoes(aid), fb=DB.cursosFb[aid]||{};
  const domDisc = d => S.mean(recs.filter(r=>r.disc===d && r.dom!=null).map(r=>r.dom));
  const geral = S.mean(recs.filter(r=>r.dom!=null).map(r=>r.dom));
  return CURSOS.map(c=>{
    const ex=CURSO_EXTRA[c.id]||{val:[],amb:[]};
    const ativ=c.ativ.filter(a=>pf.atividades.includes(a)), gosta=c.disc.filter(d=>pf.gosta.includes(d)), val=ex.val.filter(v=>pf.valores.includes(v)), amb=ex.amb.filter(v=>pf.ambientes.includes(v));
    const desemp=S.mean(c.disc.map(domDisc).filter(x=>!isNaN(x)));
    const sGos = Math.min(1, ativ.length/2*0.45 + gosta.length/c.disc.length*0.25 + val.length/2*0.2 + amb.length*0.1);
    const sDes = isNaN(desemp)?0.5:clamp(((desemp-geral)+2)/4,0,1);
    const w=pf.pesoDes/100, score=sGos*(1-w)+sDes*w;
    const motivos=[];
    if(ativ.length) motivos.push(`tem interesse em ${ativ.map(a=>a.toLowerCase()).join(" e ")}`);
    if(gosta.length) motivos.push(`gosta de ${gosta.join(" e ")}`);
    if(val.length) motivos.push(`valoriza ${val.map(a=>a.toLowerCase()).join(" e ")}`);
    if(amb.length) motivos.push(`prefere ${amb.map(a=>a.toLowerCase()).join(" e ")}`);
    if(!isNaN(desemp)) motivos.push(`tem desempenho de ${fmt(desemp,1)} em ${c.disc.join(" e ")}, ${desemp>=geral+0.2?"acima":desemp<=geral-0.2?"abaixo":"perto"} da sua média geral (${fmt(geral,1)})`);
    const prep=recs.filter(r=>c.disc.includes(r.disc)).slice(0,3);
    return {...c, score, sGos, sDes, motivos, prep, fb:fb[c.id]||""};
  }).sort((a,b)=>(a.fb==="nao")-(b.fb==="nao") || (b.fb==="sim")-(a.fb==="sim") || b.score-a.score);
}

function montarSimulado(aid){
  const sm=ui.sm, ord={"fácil":0,"média":1,"difícil":2};
  let pool=poolAluno(aid).filter(q=>(!sm.disc||q.disciplina===sm.disc)&&(!sm.tema||temaOficial(q.tema,q.disciplina)===sm.tema)).sort(()=>Math.random()-.5);
  const n=+sm.n, mix = sm.nivel==="facil"?[.6,.3,.1]:sm.nivel==="dificil"?[.1,.4,.5]:[.4,.4,.2];
  const alvo={"fácil":Math.round(n*mix[0]),"difícil":Math.round(n*mix[2])}; alvo["média"]=n-alvo["fácil"]-alvo["difícil"];
  const out=[]; ["fácil","média","difícil"].forEach(d=>pool.filter(q=>q.dificuldade===d).slice(0,alvo[d]).forEach(q=>out.push(q)));
  pool.filter(q=>!out.includes(q)).slice(0,n-out.length).forEach(q=>out.push(q));
  return out.sort((a,b)=>ord[a.dificuldade]-ord[b.dificuldade]).map(q=>q.id);
}
function responder(aid, j){
  const s=ui.sessao, q=DB.questoes.find(x=>x.id===s.fila[s.i]), ok=String(j)===String(q.resposta);
  s.resp=j; if(ok) s.acertos++;
  respDe(aid).push({qid:q.id, tema:temaOficial(q.tema,q.disciplina), disc:q.disciplina, dif:q.dificuldade, tipo:q.tipo, ok, data:agoraISO(), tentativa:respDe(aid).filter(x=>x.qid===q.id).length+1, origem:s.tipo});
  save();
}

let samplePromise = null;
function getSample(){ if(!samplePromise) samplePromise = (window.claude?.use ? window.claude.use("sample") : Promise.resolve(null)).catch(()=>null); return samplePromise; }
async function askJSON(prompt){
  const s = await getSample();
  if(!s) throw {code:"indisponivel"};
  if (typeof s.json === "function") { try { return await s.json(prompt, {modelTier:"default"}) } catch(e){ if(e?.code) throw e; } }
  const r = await s(prompt, {modelTier:"default"});
  const m = r.text.match(/\{[\s\S]*\}/); if(!m) throw {message:"Resposta sem JSON"};
  return JSON.parse(m[0]);
}
async function askText(prompt){
  const s = await getSample(); if(!s) throw {code:"indisponivel"};
  const r = await s(prompt, {modelTier:"default"}); return r.text;
}
const erroIA = e => e?.code==="not_granted"?"Você não autorizou o uso da IA nesta página.":e?.code==="rate_limited"?"Limite de uso da IA atingido; tente em alguns minutos.":e?.code==="indisponivel"?"A IA não está disponível nesta visualização.":"A IA não conseguiu responder agora.";

function parseBloco(b){
  const linhas=b.split("\n").map(s=>s.trim()).filter(Boolean);
  const alts=[], enun=[]; let resp=null;
  linhas.forEach(l=>{ const m=l.match(/^\(?([a-eA-E])[\)\.]\s+(.*)$/); const g=l.match(/^(gabarito|resposta)\s*:\s*(.*)$/i);
    if(g) resp=g[2].trim(); else if(m) alts.push(m[2]); else enun.push(l); });
  let resposta = resp!=null && alts.length ? String("abcde".indexOf(resp.toLowerCase()[0])) : (resp||"");
  if(resposta==="-1") resposta="0";
  return {enunciado:enun.join("\n"), alternativas:alts, resposta, tipo: alts.length>=2?"multipla":"discursiva"};
}
function categorizarRegras(q){
  const txt=q.enunciado+" "+q.alternativas.join(" ");
  const hit=REGRAS.find(r=>r[0].test(txt)) || [null, discVis()?.[0]||"Matemática","Geral"];
  const len=txt.length, dif = len>320||/justifique|explique|proponha/i.test(txt)?"difícil":len>150?"média":"fácil";
  const bloom = /proponha|elabore|crie/i.test(txt)?"Criar":/justifique|avalie/i.test(txt)?"Avaliar":/explique|compare|identifique/i.test(txt)?"Analisar":/calcule|determine|qual|quantos/i.test(txt)?"Aplicar":"Compreender";
  return {...q, disciplina:hit[1], tema:hit[2], area:areaDe(hit[1]), dificuldade:dif, bloom, cat:"regras"};
}

function temaStats(t){ return temaAnalise(t).resumo.map(r=>`${r.tema}: média ${fmt(r.d.mean,1)}, ${fmt(r.abaixo,0)}% abaixo do mínimo`).join("; "); }
function lerParametros(){
  const t = DB.turmas.find(x=>x.id===$("#selTP").value);
  const temas=$$(".pTema:checked").map(x=>x.value), tipos=$$(".pTipo:checked").map(x=>x.value);
  const n=Math.max(2,Math.min(20,+$("#pN").value||6));
  const pf=+$("#pF").value||0, pm=+$("#pM").value||0, pd=+$("#pD").value||0, tot=pf+pm+pd||1;
  const alvo={"fácil":Math.round(n*pf/tot), "difícil":Math.round(n*pd/tot)}; alvo["média"]=Math.max(0,n-alvo["fácil"]-alvo["difícil"]);
  return {t, temas, tipos, n, alvo, titulo:$("#pTit").value.trim()||"Avaliação", valor:+$("#pV").value||10, novas:$("#pNovas").checked, adapt:$("#pAdapt").checked, enem:$("#pEnem").checked, obs:$("#pObs").value.trim()};
}
function sorteio(P_){
  const r=Math.random;
  const crit = P_.adapt ? new Set(temaAnalise(P_.t).resumo.filter(x=>x.d.mean<DB.mediaAprov-0.05).map(x=>x.tema)) : new Set();
  const pool = DB.questoes.filter(q=>q.disciplina===P_.t.disciplina && P_.temas.includes(q.tema) && P_.tipos.includes(q.tipo));
  const usados=new Set(), itens=[];
  for(const d of ["fácil","média","difícil"]){
    pool.filter(q=>q.dificuldade===d).sort((a,b)=>(crit.has(b.tema)-crit.has(a.tema))||(r()-.5)).slice(0,P_.alvo[d]).forEach(q=>{usados.add(q.id); itens.push(q)});
  }
  pool.filter(q=>!usados.has(q.id)).sort(()=>r()-.5).slice(0,P_.n-itens.length).forEach(q=>itens.push(q));
  const ord={"fácil":0,"média":1,"difícil":2}; itens.sort((a,b)=>ord[a.dificuldade]-ord[b.dificuldade]);
  return itens;
}

  const pool = DB.questoes.filter(q=>q.disciplina===Pm.t.disciplina && Pm.temas.includes(q.tema) && Pm.tipos.includes(q.tipo));
  const prompt = `Você é um assistente pedagógico que monta provas escolares em português do Brasil.
Disciplina: ${Pm.t.disciplina}. Turma: ${Pm.t.serie}.
Monte uma prova com exatamente ${Pm.n} questões: ${Pm.alvo["fácil"]} fáceis, ${Pm.alvo["média"]} médias e ${Pm.alvo["difícil"]} difíceis.
Tópicos permitidos: ${Pm.temas.join(", ")}. Tipos permitidos: ${Pm.tipos.map(x=>TIPOS[x]).join(", ")}.
${Pm.adapt?`Desempenho da turma por tópico (0 a 10): ${temaStats(Pm.t)}. Média mínima: ${DB.mediaAprov}. Dê mais peso aos tópicos abaixo do mínimo.`:""}
${Pm.obs?`Instruções do professor: ${Pm.obs}`:""}
Prefira questões do banco abaixo. ${Pm.novas?`Se faltar questão para cumprir a distribuição, elabore questões NOVAS, originais e corretas.${Pm.enem?" As questões novas devem seguir o formato ENEM: texto-base contextualizado e 5 alternativas (A a E).":""}`:"NÃO crie questões novas."}
Banco (JSON): ${JSON.stringify(pool.map(q=>({id:q.id,tema:q.tema,tipo:q.tipo,dificuldade:q.dificuldade,enunciado:q.enunciado.slice(0,220)})))}
Ordene da mais fácil para a mais difícil.
Responda APENAS com JSON válido:
{"titulo":"string","instrucoes":"string curta para o aluno","comentario":"2 a 3 frases explicando as escolhas ao professor","itens":[{"id":"q3"} ou {"nova":{"tema":"string","tipo":"multipla|discursiva|vf","dificuldade":"fácil|média|difícil","bloom":"string","enunciado":"string","alternativas":["..."],"resposta":"índice da correta começando em 0 (vf: 0=Verdadeiro,1=Falso) ou resposta esperada para discursiva"}}]}`;
  try{
    const out = await askJSON(prompt);
    const itens = [];
    for(const it of (out.itens||[])){
      if(it.id){ const q=DB.questoes.find(x=>x.id===it.id); if(q && !itens.includes(q)) itens.push(q); }
      else if(it.nova && Pm.novas && it.nova.enunciado){
        const nq={...it.nova}; nq.tipo = TIPOS[nq.tipo]?nq.tipo:"discursiva"; nq.dificuldade=["fácil","média","difícil"].includes(nq.dificuldade)?nq.dificuldade:"média";
        if(nq.tipo==="vf") nq.alternativas=["Verdadeiro","Falso"]; if(nq.tipo==="discursiva") nq.alternativas=[];
        nq.resposta=String(nq.resposta??""); nq.disciplina=Pm.t.disciplina; nq.tema=temaOficial(nq.tema||"Geral",Pm.t.disciplina); nq.area=areaDe(Pm.t.disciplina); nq.fonte=Pm.enem?"Estilo ENEM":"Escola"; nq.id=uid("n"); nq.origem="ia"; nq.nova=true; itens.push(nq);
      }
    }
    if(!itens.length) throw {message:"sem itens"};
    ui.prova=novaProva({id:uid("p"), turma:Pm.t.id, titulo: Pm.titulo || out.titulo, instrucoes:out.instrucoes, comentario:out.comentario, itens, valor:Pm.valor, fonte:"ia", data:Date.now()}); ui.editProva=false;
    ui.gabarito=false; render(); $("#provaCard")?.scrollIntoView({behavior:"smooth"});
  }catch(e){
    st.textContent = erroIA(e)+" Usei o sorteio por regras no lugar.";

  }finally{ const b=$("#gerar"); if(b) b.disabled=false; }

function gerarLocal(Pm, keep){

    comentario: (itens.length<Pm.n?`O banco tinha só ${itens.length} questões compatíveis (pedido: ${Pm.n}). `:"") + (Pm.adapt?"Questões de tópicos abaixo do mínimo tiveram prioridade.":"")});
  ui.gabarito=false; render();
  if(keep && $("#iaStatus")) $("#iaStatus").textContent = st;
  $("#provaCard")?.scrollIntoView({behavior:"smooth"});
}
function provaTexto(p){
  const L="abcdefgh"; let s=`${p.titulo}\n\n`;
  p.itens.forEach((q,i)=>{ s+=`${i+1}) ${q.enunciado}\n`; if(q.tipo==="multipla") q.alternativas.forEach((a,j)=>s+=`   ${L[j]}) ${a}\n`); if(q.tipo==="vf") s+="   ( ) V   ( ) F\n"; s+="\n"; });
  s+="GABARITO\n"; p.itens.forEach((q,i)=>s+=`${i+1}) ${q.tipo==="multipla"?L[+q.resposta]:q.tipo==="vf"?(q.resposta==="0"?"V":"F"):q.resposta}\n`);
  return s;
}

function planoRegras(aid){
  const tr=trilhaAluno(aid).filter(r=>r.nivel!=="baixa").slice(0,4);
  const semanas = (tr.length?tr:trilhaAluno(aid).slice(0,4)).map((r,i)=>{
    const qs=DB.questoes.filter(q=>q.tema===r.tema).sort((a,b)=>({"fácil":0,"média":1,"difícil":2}[a.dificuldade]-{"fácil":0,"média":1,"difícil":2}[b.dificuldade]));
    return {semana:i+1, foco:`${r.tema} (${r.disc})`, atividades:[`Revisar a base do tópico: domínio atual ${fmt(r.dom,1)}${r.tend!=null&&r.tend<0?`, em queda de ${fmt(-r.tend,1)} ponto desde ${ANOS[r.vals.findIndex(v=>v!=null)]}`:""}.`, `Resolver as questões do banco em ordem crescente de dificuldade.`, `Fechar a semana com 1 questão estilo ENEM cronometrada (3 min) e corrigir com o gabarito comentado.`], questoes:qs.map(q=>q.id).slice(0,4)};
  });
  return {fonte:"regras", resumo:`Foco nos ${semanas.length} tópicos de maior prioridade, combinando domínio baixo e tendência de queda.`, semanas};
}

function alterarEscola(id){
  if(id!=='todas'&&!escolasPermitidas().some(e=>e.id===id)) return;
  ui.escola=id; ui.turma=null; ui.cronGrupo=null; ui.agTurma=''; ui.atrEscola=null; ui.atrDisc=null;
  save(); render();
}
function seletorEscolasTopo(){
  if(P().tipo==='aluno') return '';
  const es=escolasPermitidas(), multi=es.length>1;
  return `<div class="workspace-bar"><div class="workspace-context"><span class="workspace-icon">▦</span><span><small>ESPAÇO DE TRABALHO</small><b>${esc(nomeEscolaAtiva())}</b></span></div>

}

const NAV_ICON={painel:'◫',escolas:'▦',minhaconta:'◎',equipe:'♙',institucional:'▤',agenda:'◷',cronograma:'▦',notas:'✎',desempenho:'◉',diagnostico:'◇',trilha:'✧',questoes:'▣',provas:'▧',inicio:'⌂',minhatrilha:'✧',vocacao:'♡',praticar:'◉',meudesempenho:'▥',boletim:'▤',preciso:'◎',configuracoes:'⚙',projeto:'ⓘ'};
function renderNav(){
  const tipo=P().tipo;
  const alertas=visTurmas().reduce((n,t)=>n+quedas(t).length,0);
  const nq=DB.questoes.filter(q=>discVis().includes(q.disciplina)).length;
  const groups = tipo==='prof' ? [
    ['VISÃO GERAL',['painel','escolas','agenda']],
    ['GESTÃO PEDAGÓGICA',['notas','desempenho','diagnostico','trilha']],
    ['FERRAMENTAS',['questoes','provas']],
    ['CONTA',['minhaconta','projeto']]] : tipo==='coord' ? [
    ['INSTITUIÇÃO',['institucional','equipe','cronograma']],
    ['ACOMPANHAMENTO',['notas','desempenho','diagnostico','trilha']],
    ['RECURSOS',['questoes','configuracoes','projeto']]] : [['ÁREA DO ALUNO',NAV.map(n=>n.v)]];
  $('#navlinks').innerHTML=groups.map(([titulo,ids])=>{
    const itens=ids.map(id=>NAV.find(n=>n.v===id)).filter(n=>n&&n.r.includes(tipo));
    return itens.length?`<div class="nav-group"><div class="nav-group-title">${titulo}</div>${itens.map(n=>`<a href="#${n.v}" data-v="${n.v}"><span class="navitem-label"><span class="nav-icon">${NAV_ICON[n.v]||'•'}</span>${esc(tipo==='coord'&&n.lc?n.lc:n.l)}</span>${n.badge==='alertas'&&alertas?`<small class="alert">${alertas}</small>`:n.badge==='questoes'?`<small>${nq}</small>`:''}</a>`).join('')}</div>`:'';
  }).join('');
  $('#perfil').innerHTML=Object.entries(PERFIS).map(([k,p])=>`<option value="${k}" ${k===ui.perfil?'selected':''}>${esc(p.nome)}</option>`).join('');
  $('#papel').textContent=P().papel;
  const es=escolasPermitidas();
  $('#escolaAtiva').innerHTML=(es.length>1?`<option value="todas" ${ui.escola==='todas'?'selected':''}>Todas as escolas</option>`:'')+es.map(e=>`<option value="${e.id}" ${e.id===ui.escola?'selected':''}>${esc(e.nome)} · ${esc(e.fantasia)}</option>`).join('');
  $('#escolaAtiva').closest('label').style.display=tipo==='aluno'?'none':'';
}
function render(){
  const tipo=P().tipo, es=escolasPermitidas();
  if(tipo!=='aluno'&&ui.escola!=='todas'&&!es.some(e=>e.id===ui.escola)) ui.escola=es[0]?.id||'todas';
  let v=location.hash.slice(1);
  const item=NAV.find(n=>n.v===v);
  if(!item){v=tipo==='coord'?'institucional':tipo==='aluno'?'inicio':'painel';}
  renderNav();
  $$('#navlinks a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  if(!T()&&tipo!=='aluno') ui.turma=null; else if(T()) ui.turma=T().id;
  const view=item&&!item.r.includes(tipo)?bloqueado():V[v]();
  $('#main').innerHTML=seletorEscolasTopo()+view;
}

  else if(id==="objAl"||id==="horasAl"){ const pf=perfilDe(P().alunoId); pf.curso=$("#objAl").value; pf.horas=Math.max(1,Math.min(40,+$("#horasAl").value||8)); ui.quiz=null; save(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(id==="pfProb"){ perfilDe(P().alunoId).problema=e.target.value; save(); }
  else if(e.target.dataset.motivo!=null){ const r=respDe(P().alunoId)[+e.target.dataset.motivo]; if(r){ r.motivo=e.target.value; save(); toast("Motivo registrado."); } }
  else if(e.target.dataset.meta){ const m=DB.metas[P().alunoId].itens.find(x=>x.id===e.target.dataset.meta); m.feito=e.target.checked; save(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(["smDisc","smTema","smNivel","smN"].includes(id)){ ui.sm={disc:$("#smDisc").value, tema:id==="smDisc"?"":$("#smTema").value, nivel:$("#smNivel").value, n:+$("#smN").value}; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(["alPer","alDisc","alTema","alDif","alTipo"].includes(id)){ ui.alf={per:$("#alPer").value, disc:$("#alDisc").value, tema:id==="alDisc"?"":$("#alTema").value, dif:$("#alDif").value, tipo:$("#alTipo").value}; ui.advOpen=true; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(id==="cfgEscola"){ const e2=escola(ui.escola); if(e2) e2.fantasia=e.target.value.trim()||e2.fantasia; else DB.escola=e.target.value.trim()||DB.escola; logA("Alterou o nome da escola"); save(); render(); }
  else if(id==="cfgAno"){ DB.config.anoLetivo=+e.target.value||DB.config.anoLetivo; save(); render(); }
  else if(e.target.name==="cfgModo"){ DB.config.modo=e.target.value; logA(`Mudou o cálculo das médias para ${e.target.value==="pontos"?"soma de pontos":"média ponderada"}`); save(); render(); }
  else if(id==="cfgValor"){ DB.config.valorPeriodo=+e.target.value||10; save(); render(); }

  else if(e.target.dataset.int!=null){ DB.config.intervalo[+e.target.dataset.int]=e.target.value; save(); }

  else if(id==="cronGrupo"){ ui.cronGrupo=e.target.value; render(); }
  else if(e.target.dataset.avdata){ const [tid,vid]=e.target.dataset.avdata.split(":"), t=turmaById(tid), v=t.avaliacoes.find(x=>x.id===vid); v.data=e.target.value||undefined; if(!v.data) delete v.data; logA(`Mudou a data de ${v.nome} de ${nomeT(t)} para ${dataBR(e.target.value)}`); save(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(e.target.dataset.avpeso){ const [tid,vid]=e.target.dataset.avpeso.split(":"), t=turmaById(tid), v=t.avaliacoes.find(x=>x.id===vid); v.peso=Math.max(0,+e.target.value||0); logA(`Alterou ${DB.config.modo==="pontos"?"o valor":"o peso"} de ${v.nome} de ${nomeT(t)}`); save(); const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(id==="naTipo"){ const tp=DB.config.tipos.find(x=>x.tipo===e.target.value); $("#naP").value = DB.config.modo==="pontos"?tp.valor:tp.peso; }
  else if(id==="naD"){ const f=feriadoDe(e.target.value); $("#naHint").innerHTML = f?`<span style="color:var(--bad)">Atenção: ${esc(f.nome)} nessa data.</span>`:""; }
  else if(id==="agProf"){ ui.agProf=e.target.value; ui.agTurma=""; render(); }
  else if(id==="agTurma"){ ui.agTurma=e.target.value; render(); }
  else if(e.target.dataset.gab!=null){ const el=e.target; editarProva(p=>{ p.itens[+el.dataset.i].resposta=el.dataset.gab; p.itens[+el.dataset.i].editada=true; }, false); }
  else if(e.target.dataset.f==="tipo"){ const el=e.target; editarProva(p=>{ const q=p.itens[+el.dataset.i]; q.tipo=el.value; q.editada=true;
      if(q.tipo==="vf"){ q.alternativas=["Verdadeiro","Falso"]; q.resposta="0"; } else if(q.tipo==="discursiva"){ q.alternativas=[]; q.resposta=""; } else { if(q.alternativas.length<2||q.alternativas[0]==="Verdadeiro") q.alternativas=["","","",""]; q.resposta="0"; } }); }
  else if(e.target.dataset.f==="resposta" && e.target.tagName==="SELECT"){ const el=e.target; editarProva(p=>p.itens[+el.dataset.i].resposta=el.value, false); }

  else if(e.target.classList.contains("nota") && P().tipo==="coord"){

    const antes = t.notas[aid][vid];
    if(raw===""){ delete t.notas[aid][vid]; delete t.temaNotas[aid][vid]; }
    else { const n=+raw; if(isNaN(n)||n<0||n>10){ toast("Nota inválida: use um número de 0 a 10."); el.value=antes==null?"":String(antes).replace(".",","); return; }
      t.notas[aid][vid]=Math.round(n*100)/100;

  else if(b.dataset.delav){ const v=t.avaliacoes.find(x=>x.id===b.dataset.delav); modal(`<h2>Excluir "${esc(v.nome)}"?</h2><p>Todas as notas lançadas nessa avaliação serão apagadas.</p><div class="row" style="justify-content:flex-end"><button onclick="closeModal()">Cancelar</button><button class="pri" style="background:var(--bad);border-color:var(--bad)" id="delAvOk" data-id="${v.id}">Excluir avaliação</button></div>`); }

  else if(b.id==="quizProx"){ ui.quiz=null; const y=window.scrollY; render(); window.scrollTo(0,y); }
  else if(b.dataset.abrircurso){ ui.cursoAberto=b.dataset.abrircurso; const y=window.scrollY; render(); window.scrollTo(0,y); }

  else if(b.id==="editProva"){ ui.editProva=true; render(); $("#provaCard")?.scrollIntoView(); }
  else if(b.id==="fimEdicao"){ ui.editProva=false; render(); $("#provaCard")?.scrollIntoView(); }

  else if(b.id==="addBanco"){ const q=DB.questoes.find(x=>x.id===$("#bancoSel").value); if(q) editarProva(p=>p.itens.push({...q, alternativas:[...(q.alternativas||[])], pts:1})); }

if(!location.hash) history.replaceState(null,"","#"+(P().tipo==="coord"?"institucional":P().tipo==="aluno"?"inicio":"painel"));
save(); render();
